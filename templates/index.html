<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>OTA QUICK SNIPER</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0b1020;color:#f4f7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{max-width:720px;margin:auto;padding:16px 14px 42px}
    h1{font-size:25px;margin:8px 0 2px}
    .sub{color:#9eabc8;font-size:13px;margin-bottom:18px}
    .card{background:#151c31;border:1px solid #26304b;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 25px rgba(0,0,0,.18)}
    label{display:block;font-size:13px;color:#a9b5d0;margin:0 0 6px}
    select,input,button{width:100%;font-size:17px;border-radius:12px;border:1px solid #34405f;padding:13px;background:#0f1629;color:white}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button{margin-top:12px;background:#2563eb;border:none;font-weight:800;padding:15px}
    button:disabled{opacity:.55}
    .judge{font-size:27px;font-weight:900;margin-bottom:4px}
    .conf{font-size:17px;color:#cfd7eb}
    .bets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .bet{background:#0d1426;border:1px solid #34405f;border-radius:12px;padding:13px;text-align:center;font-size:21px;font-weight:900}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:8px 4px;border-bottom:1px solid #29334e;text-align:right}
    th:first-child,td:first-child{text-align:center}
    th:nth-child(2),td:nth-child(2){text-align:left}
    .muted{color:#9eabc8}
    .rank{line-height:1.9}
    .error{background:#3a1720;border:1px solid #7a2d3b;color:#ffd5dc;padding:14px;border-radius:12px}
    .loading{text-align:center;padding:22px;color:#b7c2db}
    details summary{cursor:pointer;font-weight:700}
    .foot{font-size:12px;color:#7785a8;line-height:1.7;margin-top:18px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>🚤 OTA QUICK SNIPER</h1>
  <div class="sub">全国24場 簡易解析版 / {{ version }}</div>

  <div class="card">
    <div class="grid">
      <div>
        <label>レース場</label>
        <select id="jcd">
          {% for code, name in venues.items() %}
          <option value="{{ code }}" {% if code == "18" %}selected{% endif %}>{{ code }} {{ name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label>レース</label>
        <select id="rno">
          {% for n in range(1,13) %}
          <option value="{{ n }}">{{ n }}R</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div style="margin-top:10px">
      <label>日付</label>
      <input id="hd" value="{{ today }}" inputmode="numeric" maxlength="8">
    </div>
    <button id="go" onclick="analyzeRace()">解析する</button>
  </div>

  <div id="result"></div>

  <div class="foot">
    ※オッズ未使用の簡易評価です。<br>
    ※同一レースは約90秒キャッシュし、BOAT RACE公式への不要な連続アクセスを抑えています。<br>
    ※展示公開前は判定材料が少なくなります。
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function laneName(data, lane){
  const r = data.racers.find(x => x.lane === lane);
  return r ? `${lane}号艇 ${r.name || ""}` : `${lane}号艇`;
}
function rankText(data, key){
  return data[key].map((lane,i)=>{
    const mark = ["◎","○","▲","△","☆","・"][i] || "";
    return `${mark} ${laneName(data,lane)}`;
  }).join("<br>");
}
function val(v, d=1){
  return (v===null || v===undefined) ? "-" : Number(v).toFixed(d);
}

async function analyzeRace(){
  const btn = $("go");
  const out = $("result");
  btn.disabled = true;
  btn.textContent = "解析中...";
  out.innerHTML = `<div class="card loading">BOAT RACE公式データを取得しています…</div>`;

  const qs = new URLSearchParams({
    jcd:$("jcd").value,
    rno:$("rno").value,
    hd:$("hd").value
  });

  try{
    const res = await fetch(`/api/analyze?${qs.toString()}`);
    const j = await res.json();
    if(!j.ok) throw new Error(j.error || "解析失敗");
    const d = j.data;

    const weather = d.weather || {};
    const racers = d.racers || [];
    const rows = racers.map(r=>`
      <tr>
        <td>${r.lane}</td>
        <td>${r.class || "-"} ${r.name || "-"}</td>
        <td>${val(r.head_score)}</td>
        <td>${val(r.second_score)}</td>
        <td>${val(r.third_score)}</td>
        <td>${val(r.exhibition,2)}</td>
        <td>${val(r.ex_st,2)}</td>
      </tr>
    `).join("");

    const bets = (d.bets || []).map((b,i)=>`<div class="bet">${i+1}. ${b}</div>`).join("");

    out.innerHTML = `
      <div class="card">
        <div class="muted">${d.venue} ${d.race}R / ${d.date}${d.cached ? " / CACHE" : ""}</div>
        <div class="judge">${d.judge}</div>
        <div class="conf">簡易信頼度 <b>${d.confidence}%</b></div>
        ${d.notes && d.notes.length ? `<div class="muted" style="margin-top:7px">${d.notes.join(" / ")}</div>` : ""}
      </div>

      <div class="card">
        <b>🌬 水面・直前条件</b>
        <div style="margin-top:10px;line-height:1.8">
          天候 ${weather.weather || "-"} /
          気温 ${val(weather.air_temp)}℃ /
          水温 ${val(weather.water_temp)}℃<br>
          風向 ${weather.wind_direction || "取得不可"} /
          風速 ${val(weather.wind_speed,0)}m /
          波高 ${val(weather.wave_height,0)}cm
          ${weather.stable_board ? "<br>⚠️ 安定板使用" : ""}
        </div>
      </div>

      <div class="card">
        <b>🎯 3連単候補</b>
        <div class="bets">${bets || "候補作成不可"}</div>
      </div>

      <div class="card">
        <b>🏁 1着適性順位</b>
        <div class="rank" style="margin-top:8px">${rankText(d,"head_rank")}</div>
      </div>

      <details class="card">
        <summary>詳しい6艇評価を見る</summary>
        <div style="overflow-x:auto;margin-top:12px">
          <table>
            <thead>
              <tr><th>枠</th><th>選手</th><th>頭</th><th>2着</th><th>3着</th><th>展示</th><th>ST</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div style="margin-top:14px" class="rank">
          <b>2着適性</b><br>${rankText(d,"second_rank")}<br><br>
          <b>3着適性</b><br>${rankText(d,"third_rank")}
        </div>
      </details>
    `;
  }catch(e){
    out.innerHTML = `<div class="error">❌ ${e.message}</div>`;
  }finally{
    btn.disabled = false;
    btn.textContent = "解析する";
  }
}
</script>
</body>
</html>
